# FotMob Silver — аналитическое ядро (#2016, эпик #1677). Генерируется; правила — README.md рядом.
# Читают: SQL dags/sql/silver/fotmob_*.sql.j2 (#2017–#2019) и аудит Charter (scripts/audit_silver_charter.py).
# from: <view>.<column> | <view>.<json_column>:<JSONPath внутри колонки> | derived: <правило>.
# В путях к элементам массивов указан представитель (homeTeam/starters/Periods.All); полный список — row_source/notes.
# conform: try — приведение строки к числу/дате/времени может не удаться -> NULL + запись в _conform_issues_json.
# registry — registry_id модели 1.1, которые колонка закрывает (полное сопоставление — field_assignment.tsv).
version: 1
source: fotmob
context_columns: [competition_id, source_season_key]
lineage_columns:            # общие для всех таблиц, в tables.*.columns не повторяются
  - {name: _bronze_batch_id, type: VARCHAR, from: _target_batch_id}
  - {name: _bronze_observed_at, type: "TIMESTAMP(6)", from: _observed_at}
  - {name: _bronze_ingested_at, type: "TIMESTAMP(6)", from: _ingested_at}
  - {name: _parser_version, type: VARCHAR, from: _parser_version}
  - {name: _conform_issues_json, type: VARCHAR, from: derived}   # JSON-массив {column, raw, reason}; NULL, если проблем нет (README: правило NULL)
tables:
  fotmob_matches:
    scope: context
    task: 2017
    grain: "один матч FotMob, один раз — в самом точном сезоне (Apertura/Clausura вместо родителя)"
    natural_key: [competition_id, source_season_key, match_id]
    partitioning: [competition_id, source_season_key]
    sources: [fotmob_matches_current, fotmob_match_payloads_current]
    dedup_order: ["_observed_at DESC", "_ingested_at DESC"]
    row_source: "fotmob_matches_current (календарь, все матчи, в т.ч. без карточки) LEFT JOIN fotmob_match_payloads_current по (competition_id, source_season_key, match_id); затем правило самого точного сезона"
    columns:
      - {name: competition_id, type: BIGINT, nullable: false, from: "fotmob_matches_current.competition_id"}
      - {name: source_season_key, type: VARCHAR, nullable: false, from: "fotmob_matches_current.source_season_key"}
      - {name: match_id, type: BIGINT, nullable: false, from: "fotmob_matches_current.match_id", registry: [E0302, E0335, E0362, M0278, M0495, M1055]}
      - {name: parent_season_key, type: VARCHAR, nullable: true, from: "derived: regexp_extract(source_season_key, '^(.+?) - (.+)$', 1), если такой ключ есть в fotmob_competition_seasons_current того же competition_id; иначе NULL"}
      - {name: scope_stage_id, type: VARCHAR, nullable: true, from: "fotmob_matches_current.scope_stage_id"}
      - {name: kickoff_utc, type: "TIMESTAMP(6) WITH TIME ZONE", nullable: true, from: "fotmob_match_payloads_current.payload_json:$.general.matchTimeUTCDate", conform: try, registry: [M0449, M1059, M1249]}
      - {name: calendar_kickoff_utc, type: "TIMESTAMP(6) WITH TIME ZONE", nullable: true, from: "fotmob_matches_current.utc_time", conform: try, registry: [E0320, E0354, E0380]}
      - {name: is_date_correct, type: BOOLEAN, nullable: true, from: "fotmob_match_payloads_current.match_facts_json:$.infoBox[\"Match Date\"].isDateCorrect", registry: [M0448]}
      - {name: timezone, type: VARCHAR, nullable: true, from: "fotmob_matches_current.timezone", registry: [E0319, E0379]}
      - {name: round_id, type: VARCHAR, nullable: true, from: "fotmob_matches_current.round_id", registry: [E0304, E0364]}
      - {name: round_name, type: VARCHAR, nullable: true, from: "fotmob_matches_current.round_name", registry: [E0305, E0365]}
      - {name: stage_id, type: VARCHAR, nullable: true, from: "fotmob_matches_current.stage_id"}
      - {name: group_name, type: VARCHAR, nullable: true, from: "fotmob_matches_current.group_name"}
      - {name: payload_league_id, type: BIGINT, nullable: true, from: "fotmob_match_payloads_current.payload_json:$.general.leagueId", registry: [M0472, M1052]}
      - {name: payload_parent_league_id, type: BIGINT, nullable: true, from: "fotmob_match_payloads_current.payload_json:$.general.parentLeagueId", registry: [M0475, M1060]}
      - {name: payload_league_name, type: VARCHAR, nullable: true, from: "fotmob_match_payloads_current.payload_json:$.general.leagueName", registry: [M0473, M1053]}
      - {name: payload_round, type: VARCHAR, nullable: true, from: "fotmob_match_payloads_current.payload_json:$.general.matchRound", registry: [M0476, M1057]}
      - {name: payload_round_name, type: VARCHAR, nullable: true, from: "fotmob_match_payloads_current.payload_json:$.general.leagueRoundName", registry: [M0477, M1054]}
      - {name: country_code, type: VARCHAR, nullable: true, from: "fotmob_match_payloads_current.payload_json:$.general.countryCode", registry: [M0285, M1046]}
      - {name: gender, type: VARCHAR, nullable: true, from: "fotmob_match_payloads_current.payload_json:$.general.gender", registry: [M1049]}
      - {name: coverage_level, type: VARCHAR, nullable: true, from: "fotmob_match_payloads_current.payload_json:$.general.coverageLevel", registry: [M1047]}
      - {name: home_team_id, type: BIGINT, nullable: true, from: "fotmob_matches_current.home_team_id", registry: [E0299, E0332, E0359]}
      - {name: home_team_name, type: VARCHAR, nullable: true, from: "fotmob_matches_current.home_team_name", registry: [E0300, E0333, E0360]}
      - {name: home_team_short_name, type: VARCHAR, nullable: true, from: "fotmob_matches_current.home_team_short_name", registry: [E0301, E0361]}
      - {name: away_team_id, type: BIGINT, nullable: true, from: "fotmob_matches_current.away_team_id", registry: [E0296, E0328, E0356]}
      - {name: away_team_name, type: VARCHAR, nullable: true, from: "fotmob_matches_current.away_team_name", registry: [E0297, E0329, E0357]}
      - {name: away_team_short_name, type: VARCHAR, nullable: true, from: "fotmob_matches_current.away_team_short_name", registry: [E0298, E0358]}
      - {name: home_score, type: INTEGER, nullable: true, from: "fotmob_matches_current.home_score", registry: [E0334]}
      - {name: away_score, type: INTEGER, nullable: true, from: "fotmob_matches_current.away_score", registry: [E0330]}
      - {name: score_text, type: VARCHAR, nullable: true, from: "fotmob_matches_current.score_text", registry: [E0317, E0352, E0377, M1247]}
      - {name: home_penalty_score, type: INTEGER, nullable: true, from: "fotmob_match_payloads_current.payload_json:$.header.status.reason.penalties[0]", registry: [M1244]}
      - {name: away_penalty_score, type: INTEGER, nullable: true, from: "fotmob_match_payloads_current.payload_json:$.header.status.reason.penalties[1]"}
      - {name: aggregate_score_text, type: VARCHAR, nullable: true, from: "fotmob_match_payloads_current.payload_json:$.header.status.aggregatedStr", registry: [M1229]}
      - {name: home_red_cards, type: INTEGER, nullable: true, from: "fotmob_match_payloads_current.payload_json:$.header.status.numberOfHomeRedCards", registry: [M1241]}
      - {name: away_red_cards, type: INTEGER, nullable: true, from: "fotmob_match_payloads_current.payload_json:$.header.status.numberOfAwayRedCards", registry: [M1240]}
      - {name: finished, type: BOOLEAN, nullable: true, from: "fotmob_matches_current.finished", registry: [E0308, E0343, E0368, M1048, M1232]}
      - {name: started, type: BOOLEAN, nullable: true, from: "fotmob_matches_current.started", registry: [E0318, E0353, E0378, M1061, M1248]}
      - {name: cancelled, type: BOOLEAN, nullable: true, from: "fotmob_matches_current.cancelled", registry: [E0307, E0342, E0367, M1231]}
      - {name: awarded, type: BOOLEAN, nullable: true, from: "fotmob_matches_current.awarded", registry: [E0306, E0341, E0366, M1230]}
      - {name: postponed, type: BOOLEAN, nullable: true, from: "fotmob_matches_current.postponed", conform: try}
      - {name: status_short, type: VARCHAR, nullable: true, from: "fotmob_matches_current.status_reason_short", registry: [E0315, E0350, E0375, M1245]}
      - {name: status_short_key, type: VARCHAR, nullable: true, from: "fotmob_matches_current.status_reason_short_key", registry: [E0316, E0351, E0376, M1246]}
      - {name: status_long, type: VARCHAR, nullable: true, from: "fotmob_matches_current.status_reason_long", registry: [E0313, E0348, E0373, M1242]}
      - {name: status_long_key, type: VARCHAR, nullable: true, from: "fotmob_matches_current.status_reason_long_key", registry: [E0314, E0349, E0374, M1243]}
      - {name: has_pending_var, type: BOOLEAN, nullable: true, from: "fotmob_match_payloads_current.payload_json:$.hasPendingVAR", registry: [M1070]}
      - {name: has_playoff, type: BOOLEAN, nullable: true, from: "fotmob_match_payloads_current.payload_json:$.content.hasPlayoff", registry: [M0054]}
      - {name: venue_name, type: VARCHAR, nullable: true, from: "fotmob_match_payloads_current.match_facts_json:$.infoBox.Stadium.name", registry: [M0470]}
      - {name: venue_city, type: VARCHAR, nullable: true, from: "fotmob_match_payloads_current.match_facts_json:$.infoBox.Stadium.city", registry: [M0466]}
      - {name: venue_country, type: VARCHAR, nullable: true, from: "fotmob_match_payloads_current.match_facts_json:$.infoBox.Stadium.country", registry: [M0467]}
      - {name: venue_capacity, type: INTEGER, nullable: true, from: "fotmob_match_payloads_current.match_facts_json:$.infoBox.Stadium.capacity", registry: [M0465]}
      - {name: venue_latitude, type: DOUBLE, nullable: true, from: "fotmob_match_payloads_current.match_facts_json:$.infoBox.Stadium.lat", registry: [M0468]}
      - {name: venue_longitude, type: DOUBLE, nullable: true, from: "fotmob_match_payloads_current.match_facts_json:$.infoBox.Stadium.long", registry: [M0469]}
      - {name: venue_surface, type: VARCHAR, nullable: true, from: "fotmob_match_payloads_current.match_facts_json:$.infoBox.Stadium.surface", registry: [M0471]}
      - {name: attendance, type: INTEGER, nullable: true, from: "fotmob_match_payloads_current.match_facts_json:$.infoBox.Attendance", registry: [M0447]}
      - {name: referee_id, type: BIGINT, nullable: true, from: "fotmob_match_payloads_current.match_facts_json:$.infoBox.Referee.id", conform: try, registry: [M0452]}
      - {name: referee_name, type: VARCHAR, nullable: true, from: "fotmob_match_payloads_current.match_facts_json:$.infoBox.Referee.text", registry: [M0464]}
      - {name: referee_country_code, type: VARCHAR, nullable: true, from: "fotmob_match_payloads_current.match_facts_json:$.infoBox.Referee.countryCode", registry: [M0451]}
      - {name: player_of_the_match_id, type: BIGINT, nullable: true, from: "fotmob_match_payloads_current.match_facts_json:$.playerOfTheMatch.id", registry: [M0507]}
      - {name: lineup_type, type: VARCHAR, nullable: true, from: "fotmob_match_payloads_current.lineup_json:$.lineupType", registry: [M0277]}
      - {name: lineup_source, type: VARCHAR, nullable: true, from: "fotmob_match_payloads_current.lineup_json:$.source", registry: [M0279]}
      - {name: weather_description, type: VARCHAR, nullable: true, from: "fotmob_match_payloads_current.payload_json:$.content.weather.description", registry: [M1033]}
      - {name: weather_temperature, type: DOUBLE, nullable: true, from: "fotmob_match_payloads_current.payload_json:$.content.weather.temperature", registry: [M1040]}
      - {name: weather_wind_speed, type: DOUBLE, nullable: true, from: "fotmob_match_payloads_current.payload_json:$.content.weather.windSpeed", registry: [M1043]}
      - {name: weather_relative_humidity, type: DOUBLE, nullable: true, from: "fotmob_match_payloads_current.payload_json:$.content.weather.relativeHumidity", registry: [M1038]}
      - {name: weather_precipitation, type: DOUBLE, nullable: true, from: "fotmob_match_payloads_current.payload_json:$.content.weather.precipitation", registry: [M1037]}
      - {name: has_payload, type: BOOLEAN, nullable: false, from: "derived: есть строка fotmob_match_payloads_current для матча"}
      - {name: has_match_facts, type: BOOLEAN, nullable: true, from: "fotmob_match_payloads_current.available_sections_json:$.matchFacts"}
      - {name: has_lineup, type: BOOLEAN, nullable: true, from: "fotmob_match_payloads_current.available_sections_json:$.lineup", registry: [M0063]}
      - {name: has_stats, type: BOOLEAN, nullable: true, from: "fotmob_match_payloads_current.available_sections_json:$.stats", registry: [M0931]}
      - {name: has_shotmap, type: BOOLEAN, nullable: true, from: "fotmob_match_payloads_current.available_sections_json:$.shotmap"}
      - {name: has_player_stats, type: BOOLEAN, nullable: true, from: "fotmob_match_payloads_current.available_sections_json:$.playerStats", registry: [M0681, M0725]}
      - {name: has_momentum, type: BOOLEAN, nullable: true, from: "fotmob_match_payloads_current.available_sections_json:$.momentum", registry: [M0676]}
      - {name: missing_expected_sections, type: "ARRAY(VARCHAR)", nullable: true, from: "fotmob_match_payloads_current.missing_expected_sections_json:$"}
      - {name: page_url, type: VARCHAR, nullable: true, from: "fotmob_matches_current.page_url", registry: [E0303, E0340, E0363]}
    raw_json:
      - {name: general_json, from: "fotmob_match_payloads_current.payload_json:$.general", holds: "секция general целиком (имя матча, цвета команд и пр.)"}
      - {name: header_status_json, from: "fotmob_match_payloads_current.payload_json:$.header.status", holds: "header.status целиком (halfs-часы, liveTime, whoLost*)"}
      - {name: info_box_json, from: "fotmob_match_payloads_current.match_facts_json:$.infoBox", holds: "infoBox целиком (статистика судьи, legInfo, Tournament)"}
      - {name: h2h_json, from: "fotmob_match_payloads_current.h2h_json", holds: "секция h2h целиком"}
      - {name: insights_json, from: "fotmob_match_payloads_current.match_facts_json:$.insights", holds: "matchFacts.insights"}
      - {name: qa_data_json, from: "fotmob_match_payloads_current.match_facts_json:$.QAData", holds: "matchFacts.QAData (вопрос-ответ)"}
      - {name: poll_json, from: "fotmob_match_payloads_current.match_facts_json:$.poll", holds: "matchFacts.poll (опрос, odds-poll)"}
      - {name: team_form_json, from: "fotmob_match_payloads_current.match_facts_json:$.teamForm", holds: "matchFacts.teamForm (форма команд перед матчем)"}
      - {name: top_players_json, from: "fotmob_match_payloads_current.match_facts_json:$.topPlayers", holds: "matchFacts.topPlayers"}
      - {name: top_scorers_json, from: "fotmob_match_payloads_current.match_facts_json:$.topScorers", holds: "matchFacts.topScorers"}
      - {name: player_of_the_match_json, from: "fotmob_match_payloads_current.match_facts_json:$.playerOfTheMatch", holds: "matchFacts.playerOfTheMatch целиком"}
      - {name: highlights_json, from: "fotmob_match_payloads_current.match_facts_json:$.highlights", holds: "matchFacts.highlights (видео)"}
      - {name: pre_review_json, from: "fotmob_match_payloads_current.match_facts_json:$.preReview", holds: "matchFacts.preReview"}
      - {name: post_review_json, from: "fotmob_match_payloads_current.match_facts_json:$.postReview", holds: "matchFacts.postReview"}
      - {name: match_insights_config_json, from: "fotmob_match_payloads_current.match_facts_json:$.matchInsightsConfig", holds: "matchFacts.matchInsightsConfig"}
      - {name: weather_json, from: "fotmob_match_payloads_current.payload_json:$.content.weather", holds: "content.weather целиком"}
      - {name: league_table_ref_json, from: "fotmob_match_payloads_current.payload_json:$.content.table", holds: "content.table (ссылка на таблицу турнира)"}
      - {name: momentum_alternate_models_json, from: "fotmob_match_payloads_current.momentum_json:$.alternateModels", holds: "momentum.alternateModels"}
  fotmob_match_teams:
    scope: context
    task: 2017
    grain: "одна сторона (home/away) матча"
    natural_key: [competition_id, source_season_key, match_id, side]
    partitioning: [competition_id, source_season_key]
    sources: [fotmob_matches_current, fotmob_match_payloads_current]
    dedup_order: ["_observed_at DESC", "_ingested_at DESC"]
    row_source: "2 строки на матч: home и away; side-объекты lineup_json:$.homeTeam/$.awayTeam, header.teams[0]/[1]"
    notes: "пути с homeTeam/home/[0] — представитель; для away те же пути с awayTeam/away/[1]"
    columns:
      - {name: competition_id, type: BIGINT, nullable: false, from: "fotmob_match_payloads_current.competition_id"}
      - {name: source_season_key, type: VARCHAR, nullable: false, from: "fotmob_match_payloads_current.source_season_key"}
      - {name: match_id, type: BIGINT, nullable: false, from: "fotmob_match_payloads_current.match_id"}
      - {name: side, type: VARCHAR, nullable: false, from: "derived: 'home' | 'away'"}
      - {name: team_id, type: BIGINT, nullable: true, from: "fotmob_match_payloads_current.payload_json:$.general.homeTeam.id", registry: [M0079, M0185, M1044, M1050, M1253]}
      - {name: team_name, type: VARCHAR, nullable: true, from: "fotmob_match_payloads_current.payload_json:$.general.homeTeam.name", registry: [M0080, M0186, M1045, M1051, M1255]}
      - {name: score, type: INTEGER, nullable: true, from: "fotmob_match_payloads_current.payload_json:$.header.teams[*].score", registry: [M1257]}
      - {name: fifa_rank, type: INTEGER, nullable: true, from: "fotmob_match_payloads_current.payload_json:$.header.teams[*].fifaRank", registry: [M1252]}
      - {name: formation, type: VARCHAR, nullable: true, from: "fotmob_match_payloads_current.lineup_json:$.homeTeam.formation", registry: [M0078, M0184]}
      - {name: team_rating, type: DOUBLE, nullable: true, from: "fotmob_match_payloads_current.lineup_json:$.homeTeam.rating", registry: [M0081, M0187]}
      - {name: average_starter_age, type: DOUBLE, nullable: true, from: "fotmob_match_payloads_current.lineup_json:$.homeTeam.averageStarterAge", registry: [M0066, M0172]}
      - {name: total_starter_market_value, type: "DECIMAL(38,8)", nullable: true, from: "fotmob_match_payloads_current.lineup_json:$.homeTeam.totalStarterMarketValue", registry: [M0155, M0260]}
      - {name: total_starter_market_value_currency, type: VARCHAR, nullable: true, from: "derived: NULL — FotMob не передаёт валюту в этой секции (по подписи «€» в карточке игрока вероятно EUR; не подтверждено — вопрос в следующий гриль)"}
      - {name: coach_id, type: BIGINT, nullable: true, from: "fotmob_match_payloads_current.lineup_json:$.homeTeam.coach.id", registry: [M0071, M0177]}
      - {name: coach_name, type: VARCHAR, nullable: true, from: "fotmob_match_payloads_current.lineup_json:$.homeTeam.coach.name", registry: [M0074, M0180]}
      - {name: coach_country_code, type: VARCHAR, nullable: true, from: "fotmob_match_payloads_current.lineup_json:$.homeTeam.coach.countryCode", registry: [M0068, M0174]}
    raw_json:
      - {name: coach_json, from: "fotmob_match_payloads_current.lineup_json:$.homeTeam.coach", holds: "объект тренера стороны целиком"}
      - {name: unavailable_json, from: "fotmob_match_payloads_current.lineup_json:$.homeTeam.unavailable", holds: "травмированные/дисквалифицированные игроки стороны"}
      - {name: attacking_zones_json, from: "fotmob_match_payloads_current.payload_json:$.content.attackingZones.home", holds: "зоны атак стороны по периодам"}
  fotmob_match_team_stats:
    scope: context
    task: 2017
    grain: "одно значение командной статистики матча: период x группа x показатель x сторона"
    natural_key: [competition_id, source_season_key, match_id, period, stat_group, stat_key, side]
    partitioning: [competition_id, source_season_key]
    sources: [fotmob_match_payloads_current]
    dedup_order: ["_observed_at DESC", "_ingested_at DESC"]
    row_source: "fotmob_match_payloads_current.stats_json:$.Periods.<period>.stats[*].stats[*], элемент stats[] = [home, away] -> 2 строки"
    columns:
      - {name: competition_id, type: BIGINT, nullable: false, from: "fotmob_match_payloads_current.competition_id"}
      - {name: source_season_key, type: VARCHAR, nullable: false, from: "fotmob_match_payloads_current.source_season_key"}
      - {name: match_id, type: BIGINT, nullable: false, from: "fotmob_match_payloads_current.match_id"}
      - {name: period, type: VARCHAR, nullable: false, from: "derived: имя ключа $.Periods.<period> (All, FirstHalf, SecondHalf, FirstExtraHalf, SecondExtraHalf)"}
      - {name: stat_group, type: VARCHAR, nullable: false, from: "fotmob_match_payloads_current.stats_json:$.Periods.All.stats[*].key", registry: [M0932, M0951, M0967, M0986, M1002]}
      - {name: stat_group_title, type: VARCHAR, nullable: true, from: "fotmob_match_payloads_current.stats_json:$.Periods.All.stats[*].title", registry: [M0942, M0958, M0977, M0993, M1012]}
      - {name: stat_key, type: VARCHAR, nullable: false, from: "fotmob_match_payloads_current.stats_json:$.Periods.All.stats[*].stats[*].key", registry: [M0935, M0954, M0970, M0989, M1005]}
      - {name: stat_title, type: VARCHAR, nullable: true, from: "fotmob_match_payloads_current.stats_json:$.Periods.All.stats[*].stats[*].title", registry: [M0940, M0956, M0975, M0991, M1010]}
      - {name: side, type: VARCHAR, nullable: false, from: "derived: 'home' для stats[0], 'away' для stats[1]"}
      - {name: team_id, type: BIGINT, nullable: true, from: "derived: fotmob_matches.home_team_id / away_team_id по side"}
      - {name: stat_value_raw, type: VARCHAR, nullable: true, from: "fotmob_match_payloads_current.stats_json:$.Periods.All.stats[*].stats[*].stats[*]", registry: [M0939, M0955, M0974, M0990, M1009]}
      - {name: stat_value, type: DOUBLE, nullable: true, from: "derived: первое число из stat_value_raw (\"401 (82%)\" -> 401)", conform: try}
      - {name: stat_value_pct, type: DOUBLE, nullable: true, from: "derived: число в скобках с % из stat_value_raw (\"401 (82%)\" -> 82)", conform: try}
      - {name: stat_format, type: VARCHAR, nullable: true, from: "fotmob_match_payloads_current.stats_json:$.Periods.All.stats[*].stats[*].format", registry: [M0933, M0952, M0968, M0987, M1003]}
