# =============================================================================
# OpenMetadata 1.5.x — Trino Lineage Workflow
# =============================================================================
# Extracts lineage from catalogued Trino view definitions.
#
# Prerequisite: `trino_ingestion.yaml` must be run first so OpenMetadata has the
# table catalog populated — view references are matched against existing entities
# to draw edges.
#
# Run:
#   docker compose exec openmetadata-ingestion \
#     metadata ingest -c /opt/configs/trino_lineage.yaml
#
# IMPORTANT: query lineage is intentionally disabled. Production traffic is
# over 100 queries/minute, so `system.runtime.queries` must stay short-lived to
# protect the coordinator heap and cannot provide a truthful daily lookback.
# Restore CTAS/INSERT lineage only after query events are persisted externally;
# do not lengthen Trino's in-memory history.
# =============================================================================

source:
  type: trino-lineage
  serviceName: trino_iceberg
  serviceConnection:
    config:
      type: Trino
      scheme: trino
      hostPort: trino:8443
      username: openmetadata
      authType:
        password: "${TRINO_OPENMETADATA_PASSWORD}"
      catalog: iceberg
      # OM 1.5+ выкинул верхнеуровневый `verifySSL` из схемы TrinoConnection
      # («Extra parameter 'verifySSL'» → workflow не стартует). Отключение
      # проверки самоподписанного серта идёт только через connectionArguments —
      # как в trino_ingestion.yaml.
      connectionArguments:
        http_scheme: https
        verify: false
  sourceConfig:
    config:
      type: DatabaseLineage
      # Preserve lineage through canonical serving views without reading the
      # coordinator's intentionally short-lived query history.
      schemaFilterPattern:
        includes:
          - "^bronze$"
          - "^silver$"
          - "^gold$"
      # Canonical WhoScored manifest-backed readers and Transfermarkt A/B
      # readers are views. Preserve lineage through their serving boundaries.
      processViewLineage: true
      processQueryLineage: false
      processStoredProcedureLineage: false
      parsingTimeoutLimit: 300

sink:
  type: metadata-rest
  config: {}

workflowConfig:
  loggerLevel: INFO
  openMetadataServerConfig:
    hostPort: http://openmetadata-server:8585/api
    authProvider: openmetadata
    securityConfig:
      jwtToken: "${OM_JWT_TOKEN}"
