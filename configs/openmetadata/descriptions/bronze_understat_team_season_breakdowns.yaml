table:
  fullyQualifiedName: trino_iceberg.iceberg.bronze.understat_team_season_breakdowns
  description: |
    Long-form source-native statistics из getTeamData Understat. Grain — один
    row на (league, season, team_id, dimension, category). Сохраняет все
    исходные breakdown dimensions (situation, formation, gameState, timing,
    shotZone, attackSpeed, result) и зеркальные against metrics без потери
    source shape. Партиционирование league, season.
  tags:
    - Tier.Bronze
    - Domain.Football
    - PII.None
