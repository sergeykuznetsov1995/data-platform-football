table:
  fullyQualifiedName: trino_iceberg.iceberg.bronze.understat_player_team_season_stats
  description: |
    Source-native клубные сезонные splits из getTeamData Understat. Grain —
    один row на (league, season, team_id, player_id). Это authoritative
    membership-таблица для multi-team игроков и xref_player; содержит полное
    семейство goals/xG/xA/xGChain/xGBuildup. Партиционирование league, season.
  tags:
    - Tier.Bronze
    - Domain.Football
    - PII.Low
