# =============================================================================
# OpenMetadata description: iceberg.bronze.understat_schedule
# =============================================================================
table:
  fullyQualifiedName: trino_iceberg.iceberg.bronze.understat_schedule
  description: |
    Source-native расписание Understat. Grain — один row на матч в точном
    (league, season) scope; wide-формат хранит обе команды, счёт, xG и
    вероятности прогноза. is_result означает завершённый матч, has_data —
    наличие непустых shots/rosters в match payload. Семь таблиц scope
    публикуются одним общим _batch_id после manifest/DQ fence.
    Технические результаты (8 матчей-исключений coverage.py) хранят
    заглушки: счёт 3:0/0:3, xG 0.0, прогноз 0.33/0.33/0.33 (27930 —
    xG 2.0/2.0, прогноз 0/1/0). Присуждённые после игры матчи хранят
    счёт поля без флага (#902). Неблокирующие аномалии источника —
    предупреждения в manifest quality_json (#1438).
  tags:
    - Tier.Bronze
    - Domain.Football
    - PII.None
columns:
  - name: league
    description: Лига (e.g. 'ENG-Premier League'); partition key.
  - name: season
    description: Сезон в формате Understat (e.g. '2526'); partition key.
  - name: source_season_id
    description: Исходный год начала сезона Understat (e.g. 2025).
  - name: game
    description: Строковый идентификатор матча Understat (slug).
  - name: game_id
    description: Числовой Understat match_id.
  - name: date
    description: >-
      Дата и время начала матча строкой источника, без перевода пояса. С сезона
      20/21 совпадает с UTC (26/27: 318 из 322 сыгранных — до минуты с FotMob);
      в истории пояс смешанный (15/16 ≈ +4 ч, EPL 17/18 +1 ч летом). Сравнивать с
      допуском ±1 ч.
  - name: home_team
    description: Название домашней команды.
  - name: home_team_code
    description: Краткий код домашней команды.
  - name: home_team_id
    description: Understat team_id домашней команды.
  - name: home_goals
    description: Голы домашней команды (итог матча); у присуждённых после игры — счёт поля без флага (#902), у технических результатов — 3 или 0.
  - name: home_xg
    description: Ожидаемые голы (xG) домашней команды; технические результаты (матчи-исключения 4238, 27930, 11214, 11222, 11249, 11260, 14229, 14235) несут заглушку 0.0 (27930 — 2.0).
  - name: away_team
    description: Название гостевой команды.
  - name: away_team_code
    description: Краткий код гостевой команды.
  - name: away_team_id
    description: Understat team_id гостевой команды.
  - name: away_goals
    description: Голы гостевой команды (итог матча); у присуждённых после игры — счёт поля без флага (#902), у технических результатов — 3 или 0.
  - name: away_xg
    description: Ожидаемые голы (xG) гостевой команды; технические результаты (матчи-исключения 4238, 27930, 11214, 11222, 11249, 11260, 14229, 14235) несут заглушку 0.0 (27930 — 2.0).
  - name: has_data
    description: Доступны ли детальные Understat-данные по матчу.
  - name: is_result
    description: Матч завершён (true) или ещё не сыгран (false).
  - name: forecast_home_win
    description: Вероятность победы хозяев из source forecast (double с #1440); технические результаты (матчи-исключения 4238, 27930, 11214, 11222, 11249, 11260, 14229, 14235) несут заглушку 0.33 (27930 — 0.0).
  - name: forecast_draw
    description: Вероятность ничьей из source forecast (double с #1440); технические результаты (матчи-исключения 4238, 27930, 11214, 11222, 11249, 11260, 14229, 14235) несут заглушку 0.33 (27930 — 1.0).
  - name: forecast_away_win
    description: Вероятность победы гостей из source forecast (double с #1440); технические результаты (матчи-исключения 4238, 27930, 11214, 11222, 11249, 11260, 14229, 14235) несут заглушку 0.33 (27930 — 0.0).
  - name: url
    description: URL страницы матча на understat.com.
  - name: league_id
    description: Внутренний идентификатор лиги Understat.
  - name: season_id
    description: Внутренний идентификатор сезона Understat.
  - name: _source
    description: Источник данных ('understat'); метаколонка Bronze.
  - name: _entity_type
    description: Тип сущности в Bronze; метаколонка.
  - name: _ingested_at
    description: Timestamp ingest'а строки в Bronze; метаколонка.
  - name: _batch_id
    description: Общий publication batch для всех семи таблиц league-season scope.
