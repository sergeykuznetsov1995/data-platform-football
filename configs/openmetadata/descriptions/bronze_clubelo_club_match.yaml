# =============================================================================
# OpenMetadata description: iceberg.bronze.clubelo_club_match
# =============================================================================
table:
  fullyQualifiedName: trino_iceberg.iceberg.bronze.clubelo_club_match
  description: |
    Таблица «Calculation» страницы клуба /{slug} (#1462): последние 16 матчей
    клуба, включая ещё не сыгранные/не пересчитанные (6 ячеек вместо 14,
    has_result=false) и дубли одного дня (R-41). Разбор позиционный и
    fail-closed; значение и σ хранятся раздельно. Append-only, без партиций.
    Grain — строка (slug, captured_rating_date, row_seq).
    Читать через манифест: брать строки, для которых в clubelo_history_manifest
    есть строка status='done' с тем же slug и _batch_id. Таблицы коммитятся по
    очереди (raw → точки → матчи → манифест); при сбое между ними строки
    незакрытого клуба остаются, а следующий прогон пишет их заново (дубли без
    done в манифесте).
  tags:
    - Tier.Bronze
    - Domain.Football
    - PII.None
columns:
  - name: slug
    description: Slug клуба-владельца страницы.
  - name: captured_rating_date
    description: Дата рейтинга из h1 страницы.
  - name: row_seq
    description: Номер строки в таблице страницы (с 0, сверху вниз — от нового к старому).
  - name: match_date
    description: Дата матча (ссылка /<date> первой ячейки).
  - name: venue
    description: H / A / N — дома, в гостях, нейтральное поле.
  - name: opp_slug
    description: Slug соперника; NULL, если у соперника нет ссылки.
  - name: opp_tlc
    description: Трёхбуквенное сокращение соперника (span.max640).
  - name: opp_name
    description: Название соперника (span.min641).
  - name: opp_country
    description: Код страны соперника (alt флага).
  - name: opp_rank
    description: Место соперника в рейтинге; NULL без места.
  - name: prior_delta
    description: Prior Δ — значение (без σ).
  - name: prior_delta_sigma
    description: Prior Δ — σ (число после «±»).
  - name: hfa
    description: HFA — преимущество своего поля.
  - name: elo_pct
    description: Elo % — ожидаемый результат, точное значение из span.min1081.
  - name: ft
    description: Счёт основного времени ('1-2'); NULL, если результата нет.
  - name: et
    description: Счёт после дополнительного времени; NULL, если не было.
  - name: pen
    description: Серия пенальти; NULL, если не было.
  - name: game_delta
    description: Game Δ — значение.
  - name: game_delta_sigma
    description: Game Δ — σ.
  - name: post_game_delta
    description: Post-Game Δ — значение.
  - name: post_game_delta_sigma
    description: Post-Game Δ — σ.
  - name: elo_change
    description: Elo +/- — изменение Elo за матч; NULL, если ячейка пуста.
  - name: new_elo
    description: New Elo после матча; NULL для строк без результата.
  - name: new_rank
    description: New Rank после матча; NULL для строк без результата.
  - name: has_result
    description: true, если у строки есть счёт FT (14 ячеек со счётом); false — прогноз без результата.
  - name: fetched_at
    description: Момент скачивания страницы (UTC).
  - name: model_version
    description: Версия модели Elo; всегда 'web-2026' — новый сайт пересчитал историю, с архивом 'api-legacy' без пометки не склеивать (R-17).
  - name: _source
    description: Источник данных ('clubelo_html'); метаколонка Bronze.
  - name: _ingested_at
    description: Момент записи строки в Bronze (UTC), не дата данных; метаколонка.
  - name: _batch_id
    description: Идентификатор прогона истории ('clubelo-history-<UTC>-<hex>'); метаколонка.
