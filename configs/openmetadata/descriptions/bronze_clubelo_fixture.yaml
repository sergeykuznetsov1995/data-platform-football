# =============================================================================
# OpenMetadata description: iceberg.bronze.clubelo_fixture
# =============================================================================
table:
  fullyQualifiedName: trino_iceberg.iceberg.bronze.clubelo_fixture
  description: |
    Ближайшие матчи со страницы /Fixtures ClubElo с прогнозом сайта (#1982): 1/X/2, очки
    на сейчас и «на кону» у каждой команды (шанс сейчас и при победе/ничьей/поражении).
    Пишет scrapers/clubelo/daily.py (dag_ingest_clubelo) раз на дату рейтинга вместе с
    /Results: партиция identity(rating_date) заменяется целиком — одна строка на матч,
    прогноз на момент забора. Сырая страница — clubelo_raw_page (page='/Fixtures').
    Пустая страница (как 24.09) ничего не пишет. Смена вёрстки — ничего разобранного
    не пишется, прогон не краснеет (fixtures_error в результате). Модель 'web-2026'.
  tags:
    - Tier.Bronze
    - Domain.Football
    - PII.None
columns:
  - name: rating_date
    description: h1-дата страницы /Fixtures (дата рейтинга сайта). Партиция.
  - name: game_id
    description: Id матча на сайте (data-live-status-game-id). Ключ строки внутри партиции.
  - name: kickoff_utc
    description: Начало матча, UTC (data-utc-time).
  - name: competition
    description: "Строка-секция над матчем: лига/стадия, как на странице (бывает без страны, напр. 'Regular Season')."
  - name: so_far_unit
    description: Единица колонки «So Far» в секции (на 30.10 — 'Points').
  - name: row_seq
    description: Порядок матча на странице (с 0).
  - name: draw_pct
    description: "Прогноз сайта: вероятность ничьей, % (колонка «X»)."
  - name: home_key
    description: Ключ хозяев — slug или '~CC:Имя', если ссылки на страницу клуба нет.
  - name: home_slug
    description: Slug хозяев; NULL без ссылки на страницу клуба.
  - name: home_tlc
    description: Трёхбуквенный код хозяев (узкая вёрстка).
  - name: home_name
    description: Название хозяев, как на странице.
  - name: home_country
    description: Страна хозяев (alt флага).
  - name: home_rank
    description: Мировое место хозяев на странице; NULL, если не показано.
  - name: home_so_far
    description: "«So Far» хозяев: набранное в турнире на момент забора, в единицах so_far_unit."
  - name: home_win_pct
    description: "Прогноз сайта: вероятность победы хозяев, % (колонка «1» у хозяев, «2» у гостей)."
  - name: home_stake
    description: "«At stake» хозяев: на что влияет матч (Champion, Relegation, Promotion, Round of 16, …) — текст широкой вёрстки."
  - name: home_stake_chance
