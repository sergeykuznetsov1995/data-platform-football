table:
  fullyQualifiedName: trino_iceberg.iceberg.bronze.espn_legacy_baseline_v2
  description: |
    Indefinitely retained one-scope migration baseline captured before cutover.
    It binds legacy counts and Iceberg snapshot IDs to exact manifest and replay
    Raw hashes; migration never drops or rewrites the legacy objects.
  tags: [Tier.Bronze, Domain.Football, PII.None]
columns:
  - name: scope_id
    description: Scope promoted after this baseline was captured.
  - name: entity_metrics_json
    description: Canonical legacy counts, keys and date metrics for all entities.
  - name: legacy_snapshot_ids_json
    description: Exact pre-cutover Iceberg snapshot IDs for all legacy tables.
  - name: durable_manifest_sha256
    description: SHA-256 of the exact green-run durable manifest.
  - name: replay_raw_manifest_sha256
    description: SHA-256 of the exact replay Raw manifest.
  - name: trust_label
    description: trusted for admitted scopes; pre-2016 is legacy_untrusted.
  - name: baseline_sha256
    description: Immutable baseline fingerprint.
