# =============================================================================
# OpenMetadata description: iceberg.bronze.espn_lineup
# =============================================================================
table:
  fullyQualifiedName: trino_iceberg.iceberg.bronze.espn_lineup
  description: |
    Canonical public ESPN lineup serving view for compact6. It exposes the
    reviewed native/legacy row superset: native rows require an exact COMPLETE
    manifest and approved cutover, while frozen archive rows remain the
    compatibility fallback. Consumers query bronze.espn_lineup only;
    transition and archive relations are restricted internal state.
  tags:
    - Tier.Bronze
    - Domain.Football
    - PII.Low
columns:
  - name: scope_id
    description: Native competition/edition scope; null on archived legacy fallback rows.
  - name: competition_id
    description: Authoritative numeric ESPN competition ID; null on legacy fallback rows.
  - name: event_id
    description: Authoritative numeric ESPN event ID; null on legacy fallback rows.
  - name: team_id
    description: Authoritative numeric ESPN team ID; null on legacy fallback rows.
  - name: athlete_id
    description: Authoritative numeric ESPN athlete ID; null on legacy fallback rows.
  - name: generation_id
    description: COMPLETE native generation identity; null on legacy fallback rows.
  - name: raw_uri
    description: Immutable Raw source URI for a native row; null on archived legacy fallback rows.
  - name: raw_sha256
    description: SHA-256 of the native Raw source; null on archived legacy fallback rows.
  - name: league
    description: Лига (e.g. 'ENG-Premier League'); partition key.
  - name: season
    description: Сезон в формате 'YYZZ' (e.g. '2526'); partition key.
  - name: game
    description: Строковый идентификатор матча ESPN (slug с префиксом-датой).
  - name: team
    description: Команда игрока.
  - name: player
    description: Имя игрока.
    tags:
      - PII.Low
  - name: is_home
    description: Играет ли команда дома (true) или в гостях (false).
  - name: position
    description: Позиция игрока в матче.
  - name: formation_place
    description: Номер места игрока в схеме построения команды.
  - name: sub_in
    description: Минута выхода на замену (если выходил).
  - name: sub_out
    description: Минута ухода с поля заменой (если заменён).
  - name: appearances
    description: Признак появления игрока в матче (0/1).
  - name: fouls_committed
    description: Совершено фолов.
  - name: fouls_suffered
    description: Заработано фолов на себе.
  - name: own_goals
    description: Автоголы.
  - name: red_cards
    description: Красные карточки.
  - name: sub_ins
    description: Количество выходов на замену.
  - name: yellow_cards
    description: Жёлтые карточки.
  - name: goals_conceded
    description: Пропущено голов (для вратаря).
  - name: saves
    description: Сейвы (для вратаря).
  - name: shots_faced
    description: Удары по воротам, отражённые/принятые (для вратаря).
  - name: goal_assists
    description: Голевые передачи.
  - name: shots_on_target
    description: Удары в створ.
  - name: total_goals
    description: Забитые голы.
  - name: total_shots
    description: Всего ударов.
  - name: offsides
    description: Положения вне игры.
  - name: _source
    description: Источник данных ('espn'); метаколонка Bronze.
  - name: _entity_type
    description: Тип сущности в Bronze; метаколонка.
  - name: _ingested_at
    description: Timestamp ingest'а строки в Bronze; метаколонка.
  - name: _batch_id
    description: Идентификатор батча ingest'а; метаколонка.
