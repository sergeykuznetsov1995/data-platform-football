# =============================================================================
# OpenMetadata description: iceberg.bronze.espn_matchsheet
# =============================================================================
table:
  fullyQualifiedName: trino_iceberg.iceberg.bronze.espn_matchsheet
  description: |
    Canonical public ESPN matchsheet serving view for compact6. It exposes the
    reviewed native/legacy row superset: native rows require an exact COMPLETE
    manifest and approved cutover, while frozen archive rows remain the
    compatibility fallback. Consumers query bronze.espn_matchsheet only;
    transition and archive relations are restricted internal state.
  tags:
    - Tier.Bronze
    - Domain.Football
    - PII.Low
columns:
  - name: scope_id
    description: Native competition/edition scope; null on archived legacy fallback rows.
  - name: competition_id
    description: Authoritative numeric ESPN competition ID; null on legacy fallback rows.
  - name: event_id
    description: Authoritative numeric ESPN event ID; null on legacy fallback rows.
  - name: team_id
    description: Authoritative numeric ESPN team ID; null on legacy fallback rows.
  - name: generation_id
    description: COMPLETE native generation identity; null on legacy fallback rows.
  - name: raw_uri
    description: Immutable Raw source URI for a native row; null on archived legacy fallback rows.
  - name: raw_sha256
    description: SHA-256 of the native Raw source; null on archived legacy fallback rows.
  - name: league
    description: Лига (e.g. 'ENG-Premier League'); partition key.
  - name: season
    description: Сезон в формате 'YYZZ' (e.g. '2526'); partition key.
  - name: game
    description: Строковый идентификатор матча ESPN (slug с префиксом-датой).
  - name: team
    description: Команда строки протокола.
  - name: is_home
    description: Играет ли команда дома (true) или в гостях (false).
  - name: venue
    description: Название стадиона; читается Gold dim_venue.
  - name: attendance
    description: Посещаемость матча (bigint).
  - name: capacity
    description: Вместимость стадиона; исторически 100% NULL и разрешена явным allowlist.
  - name: roster
    description: Состав команды (список игроков) строкой.
    tags:
      - PII.Low
  - name: fouls_committed
    description: Совершено фолов командой.
  - name: yellow_cards
