# =============================================================================
# OpenMetadata description: iceberg.bronze.espn_schedule
# =============================================================================
table:
  fullyQualifiedName: trino_iceberg.iceberg.bronze.espn_schedule
  description: |
    Canonical public ESPN schedule serving view for compact6. It exposes the
    reviewed native/legacy row superset: native rows require an exact COMPLETE
    manifest and approved cutover, while frozen archive rows remain the
    compatibility fallback. Consumers query bronze.espn_schedule only;
    transition and archive relations are restricted internal state.
  tags:
    - Tier.Bronze
    - Domain.Football
    - PII.None
columns:
  - name: scope_id
    description: Native competition/edition scope; null on archived legacy fallback rows.
  - name: competition_id
    description: Authoritative numeric ESPN competition ID; null on legacy fallback rows.
  - name: event_id
    description: Authoritative numeric ESPN event ID; null on legacy fallback rows.
  - name: generation_id
    description: COMPLETE native generation identity; null on legacy fallback rows.
  - name: raw_uri
    description: Immutable Raw source URI for a native row; null on archived legacy fallback rows.
  - name: raw_sha256
    description: SHA-256 of the native Raw source; null on archived legacy fallback rows.
  - name: league
    description: Лига (e.g. 'ENG-Premier League'); partition key.
  - name: season
    description: Сезон в формате 'YYZZ' (e.g. '2526'); partition key.
  - name: game
    description: Строковый идентификатор матча ESPN (slug с префиксом-датой, e.g. '2025-08-15 Liverpool-AFC Bournemouth').
  - name: match_date
    description: Дата и время начала матча (timestamp).
  - name: home_team
    description: Название домашней команды.
  - name: away_team
    description: Название гостевой команды.
  - name: game_id
    description: Числовой ESPN match_id (bigint).
  - name: league_id
    description: Внутренний идентификатор лиги ESPN.
  - name: _source
    description: Источник данных ('espn'); метаколонка Bronze.
  - name: _entity_type
    description: Тип сущности в Bronze; метаколонка.
  - name: _ingested_at
    description: Timestamp ingest'а строки в Bronze; метаколонка.
  - name: _batch_id
    description: Идентификатор батча ingest'а; метаколонка.
