connector.name=iceberg

# Iceberg REST catalog (Lakekeeper). Warehouse name matches the one created
# via `make bootstrap-catalog` (configs/lakekeeper/warehouse.json).
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://lakekeeper:8181/catalog
iceberg.rest-catalog.warehouse=football
iceberg.rest-catalog.security=NONE

# Native S3 filesystem on SeaweedFS with static credentials (no vended creds —
# the warehouse is created with sts-enabled=false, so Trino authenticates to S3
# directly using these keys). Keys come from the trino service environment.
fs.native-s3.enabled=true
s3.endpoint=http://seaweedfs:8333
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=${ENV:S3_ACCESS_KEY}
s3.aws-secret-key=${ENV:S3_SECRET_KEY}

# Performance settings
iceberg.file-format=PARQUET
iceberg.compression-codec=ZSTD

# Metadata settings
iceberg.max-partitions-per-writer=1000
iceberg.target-max-file-size=128MB
