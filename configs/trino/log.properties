# #2122: DEBUG on http/security wrote 2.6M lines in 3 days on the shared server;
# raise to DEBUG only while debugging a login problem, then revert.
io.trino=INFO
io.trino.server.security=INFO
io.trino.server.ui=INFO
io.airlift.http.server=INFO
io.airlift.http.server.HttpServer=INFO
io.trino.server.security.ResourceSecurity=INFO
io.trino.server.security.AuthenticationFilter=INFO
io.trino.server.security.PasswordAuthenticatorManager=INFO
# #2122: Iceberg prints a ~3 KB CommitReport/ScanReport INFO line per commit/scan —
# 683k lines (~2 GB) in 3 days on the shared server. WARN keeps real problems.
org.apache.iceberg.metrics.LoggingMetricsReporter=WARN
