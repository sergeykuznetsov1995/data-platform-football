# SofaScore выделенный платный шлюз — ОТДЕЛЬНЫЙ compose-проект (#951).
#
# Почему отдельный файл/проект, а не сервис в общем compose.yaml:
# все источники (fbref/whoscored/sofascore/…) делят ОДИН compose-проект
# `data-platform`. Любой `docker compose up` из чужого чекаута пересоздаёт ВСЕ
# сервисы проекта — и раньше сносил этот шлюз (инцидент 2026-07-17). Вынос шлюза
# в собственный проект делает его невосприимчивым к чужим `up`: его жизненный
# цикл управляется ТОЛЬКО этим файлом.
#
# Файл описывает шлюз ровно так, как он работает с 2026-07-27 (#999/#1000): раньше
# это была цепочка «база + override.v3 + all-men override» с тегами !override, где
# два файла из трёх жили вне git (#1155, этап 3). Ключевые решения цепочки:
# 1) дерево релиза смонтировано ЦЕЛИКОМ в /opt/sofascore-repo (ro), PYTHONPATH туда же:
#    filter_proxy.py при запуске из /opt/airflow требует вшитый в образ WhoScored-якорь
#    (в пинованном образе его нет); при другом корне якорь сам грузится из дерева.
#    WhoScored-аттестация не входит в sofascore-контракт — боевой подписант здесь
#    verified-артефакт SofaScore.
# 2) сеть — только sofascore-net (своя, внешняя); scheduler проекта sofascore-airflow
#    ходит по алиасу сервиса `sofascore_proxy_filter:8899`. dp-backend не подключаем.
# 3) образ пинованный, без build: шлюз никогда не собирается на месте.
# Каждый путь хоста — переменная без дефолта (см. sofascore.env.example).
#
# Запуск — только через deploy/sofascore/deploy.sh. Вручную (после `set -a; . sofascore.env`):
#   docker compose -p sofascore-gw -f deploy/sofascore/gateway.compose.yaml \
#     --project-directory "$SOFASCORE_RELEASE_ROOT" \
#     --env-file <общий .env> --env-file <sofascore.env> \
#     up -d --no-deps --force-recreate sofascore_proxy_filter
name: sofascore-gw

services:
  sofascore_proxy_filter:
    image: ${SOFASCORE_GATEWAY_IMAGE:?set the pinned SofaScore gateway image}
    container_name: sofascore_gw_951
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      PYTHONPATH: /opt/sofascore-repo
      PROXY_FILTER_CONTROL_TOKEN: ${SOFASCORE_PROXY_CONTROL_TOKEN:-}
      # Один и тот же неизменяемый container contract используют gateway и
      # scheduler; host location задаётся отдельно bind-переменной ниже.
      SOFASCORE_PROXY_BUDGET_ARTIFACT: /opt/airflow/runtime/sofascore/proxy_budget_canary.json
      SOFASCORE_PROXY_BUDGET_ARTIFACT_ID: ${SOFASCORE_PROXY_BUDGET_ARTIFACT_ID:?set the exact verified SofaScore artifact SHA-256}
      # Купленный под SofaScore пул. Своё имя переменной, а не общий PROXY_POOL_JSON
      # из платформенного .env: иначе шлюз молча уедет на чужой пул. Без значения —
      # fail-closed на платный путь.
      PROXY_POOL_JSON: ${SOFASCORE_PROXY_POOL_JSON:?set the SofaScore paid proxy pool JSON}
      PROXY_FILTER_ALLOW_FILE_FALLBACK: "true"
    command:
      - python
      - /opt/sofascore-repo/scripts/proxy_filter/filter_proxy.py
      - --listen
      - 0.0.0.0:8899
      - --lease-listen
      - 0.0.0.0:8900
      - --lease-proxy-url
      - http://sofascore_proxy_filter:8900
      - --proxy-file
      - /opt/airflow/proxys.txt
      - --allow-proxy-file-fallback
      - --blocklist
      - /opt/sofascore-repo/configs/proxy_filter/blocklist.txt
      - --out
      - /opt/airflow/logs/sofascore_proxy_filter/bytes.json
      - --daily-budget-mb
      - ${SOFASCORE_PROXY_DAILY_BUDGET_MB:-300}
      - --max-lease-mb
      - ${SOFASCORE_PROXY_MAX_LEASE_MB:-46}
      - --max-lease-ttl-seconds
      - ${SOFASCORE_PROXY_MAX_LEASE_TTL_SECONDS:-3600}
      - --dagrun-budget-bytes
      - ${SOFASCORE_PROXY_DAGRUN_BUDGET_BYTES:-8000000}
      - --url-budget-bytes
      - ${SOFASCORE_PROXY_URL_BUDGET_BYTES:-2000000}
      # SofaScore = один активный лиз за раз (сериализация источника).
      - --max-active-leases
      - "1"
      - --sofascore-budget-artifact
      - /opt/airflow/runtime/sofascore/proxy_budget_canary.json
      # 0 = боевой подписант (не эксперимент-канарейка).
      - --sofascore-canary-hard-cap-bytes
      - "0"
      - --sofascore-discovery-dagrun-budget-bytes
      - ${PROXY_FILTER_SOFASCORE_DISCOVERY_DAGRUN_BUDGET_BYTES:-0}
      - --ledger
      - /opt/airflow/logs/sofascore_proxy_filter/paid_requests.jsonl
      - --sofascore-allocation-ledger
      - /opt/airflow/logs/sofascore_proxy_filter/sofascore_allocations.json
      - --sofascore-allocation-wal
      - /opt/airflow/logs/sofascore_proxy_filter/sofascore_allocation_claims.jsonl
      - --sofascore-parent-envelope
      - /opt/airflow/logs/sofascore_proxy_filter/sofascore_parent_envelopes.json
    volumes:
      # Дерево релиза целиком (см. решение 1 в шапке). Runtime-fingerprint входы —
      # внутри него: контрольная плоскость пересчитывает тот же digest, что и Airflow.
      - type: bind
        source: ${SOFASCORE_RELEASE_ROOT:?set the absolute frozen release root}
        target: /opt/sofascore-repo
        read_only: true
        bind:
          create_host_path: false
      # Файл-fallback прокси шлюза (секрет, вне git и вне дерева релиза).
      - type: bind
        source: ${SOFASCORE_GATEWAY_FALLBACK_PROXY_FILE:?set the gateway proxy fallback file}
        target: /opt/airflow/proxys.txt
        read_only: true
        bind:
          create_host_path: false
      # Artifact and mutable accounting state are deployment-owned and live
      # outside the release checkout.  Long bind syntax prevents Docker from
      # silently replacing a missing source with an empty file/directory.
      - type: bind
        source: ${SOFASCORE_PROXY_BUDGET_ARTIFACT_HOST:?set the immutable verified SofaScore budget artifact host file}
        target: /opt/airflow/runtime/sofascore/proxy_budget_canary.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${SOFASCORE_GATEWAY_STATE_HOST_DIR:?set the durable SofaScore gateway state host directory}
        target: /opt/airflow/logs/sofascore_proxy_filter
        bind:
          create_host_path: false
    healthcheck:
      test:
        - CMD
        - python
        - /opt/sofascore-repo/scripts/sofascore_runtime_preflight.py
        - gateway-health
        - --artifact
        - /opt/airflow/runtime/sofascore/proxy_budget_canary.json
        - --state-dir
        - /opt/airflow/logs/sofascore_proxy_filter
        - --health-url
        - http://localhost:8899/health
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        # Startup replays the allocation WAL (~135 MB by 2026-08-23) into
        # memory at <2x its size; 256M OOM-crashlooped recovery on 2026-07-24
        # and the `docker update --memory 1g` workaround was silently dropped
        # by the 2026-08-23 recreate.  The limit must live here, not in
        # `docker update`.
        limits:
          memory: 1G
        reservations:
          memory: 256M
    networks:
      - sofascore-net

networks:
  # Своя сеть контура; создаётся один раз руками: `docker network create sofascore-net`.
  sofascore-net:
    external: true
    name: sofascore-net
