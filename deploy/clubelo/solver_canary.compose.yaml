# Disposable project only. The outer controller must pass a unique -p name.
# No default host paths: every bind is explicitly supplied at execution.
# Required inputs (not permission for a live preflight):
# - CLUBELO_GATEWAY_IMAGE is the reviewed existing image pinned by sha256 digest;
#   the frozen gateway code must match that release;
# - CLUBELO_RELEASE_ROOT and CLUBELO_GATEWAY_STATE_HOST_DIR are isolated canary
#   directories; never pass live release/state directories to this project;
# - PROXY_POOL_JSON is the dedicated canary provider account; its verified daily
#   HARD cap is 2048 MiB, plus the controller's 2 GiB experiment-wide ceiling;
# - the runner token file equals CLUBELO_PROXY_CONTROL_TOKEN; the separate
#   PROXY_FILTER_CONTROL_TOKEN is not the ClubElo control token;
# - both solver digests use the SAME reviewed canary Dockerfile/entrypoint;
#   the entrypoint requires active_run.json, registers the detection observer in
#   sys.modules, and installs it with the fixed observer directory and arm;
# - per-run observer dirs are fresh, owner-only, active_run.json exists BEFORE
#   solver startup; each arm uses a separate observer dir for each run;
# - runner mounts only the selected arm; uid matches the observer file owner;
# - selected solver has completed requests/cleanup before final report readback;
# - controller deactivates active_run.json only AFTER a complete atomic report.
# The controller also enforces randomized whole runs, 30 days, 60 runs/arm,
# 240 attempts total, 2 bootstrap starts/minute and 2 GiB provider bytes total.
# Per-arm minima are 30 detected challenges, 40 attempts and 20 runs.
# Keep 3 attempts/run, 10s retry pause, 90s challenge and 120s client timeouts.
# Before startup, the controller must verify enforcement of every ceiling and
# the independent provider-side 2048 MiB daily HARD cap; otherwise fail closed.
# Success gates and rollback remain in clubelo-solver-stack-eval-2251.md.

x-hardened: &hardened
  restart: "no"
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: none

x-solver-environment: &solver-environment
  PYTHONDONTWRITEBYTECODE: "1"
  CAPTCHA_SOLVER: none

services:
  clubelo-canary-gateway:
    <<: *hardened
    # The controller verifies the digest before starting this disposable project.
    image: "${CLUBELO_GATEWAY_IMAGE:?Required existing gateway image pinned by sha256 digest}"
    pull_policy: never
    networks: [internal, egress]
    user: "${CLUBELO_CANARY_GATEWAY_UID:-50000}:${CLUBELO_CANARY_GATEWAY_GID:-0}"
    working_dir: /canary/gateway
    entrypoint: ["/usr/bin/dumb-init", "--", "/entrypoint"]
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: /canary/gateway
      CONNECTION_CHECK_MAX_COUNT: "0"
      PROXY_POOL_JSON: ${PROXY_POOL_JSON:?Required dedicated canary residential proxy pool}
      PROXY_FILTER_CONTROL_TOKEN: ${PROXY_FILTER_CONTROL_TOKEN:?Required distinct control token}
      CLUBELO_PROXY_CONTROL_TOKEN: ${CLUBELO_PROXY_CONTROL_TOKEN:?Required ClubElo control token}
      PROXY_FILTER_CLUBELO_DAGRUN_BUDGET_BYTES: "33554432"
      PROXY_FILTER_CLUBELO_HISTORY_DAGRUN_BUDGET_BYTES: "33554432"
      PROXY_FILTER_ALLOW_FILE_FALLBACK: "false"
    command:
      - python
      - /canary/gateway/scripts/fbref_proxy/filter_proxy.py
      - --source-mode
      - shared-no-whoscored
      - --listen
      - 0.0.0.0:8899
      - --lease-listen
      - 0.0.0.0:8900
      - --lease-proxy-url
      - http://clubelo-canary-gateway:8900
      - --daily-budget-mb
      - "2048"
      - --max-lease-mb
      - "32"
      - --url-budget-bytes
      - "33554432"
      - --max-lease-ttl-seconds
      - "3600"
      - --max-active-leases
      - "1"
      - --out
      - /canary/state/bytes.json
      - --ledger
      - /canary/state/paid_requests.jsonl
    volumes:
      - type: bind
        source: ${CLUBELO_RELEASE_ROOT:?Required isolated frozen reviewed gateway code}
        target: /canary/gateway
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${CLUBELO_GATEWAY_STATE_HOST_DIR:?Required separate durable canary gateway state}
        target: /canary/state
        bind:
          create_host_path: false
    tmpfs: ["/tmp:rw,nosuid,nodev,noexec,size=64m"]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128

  solver-control:
    <<: *hardened
    profiles: [control]
    image: "${CLUBELO_CANARY_CONTROL_REPOSITORY:?Required instrumented control repository}@sha256:${CLUBELO_CANARY_CONTROL_DIGEST:?Required immutable control digest}"
    pull_policy: never
    networks: [internal]
    user: "${CLUBELO_CANARY_SOLVER_UID:-1000}:${CLUBELO_CANARY_SOLVER_GID:-1000}"
    environment:
      <<: *solver-environment
      CLUBELO_CANARY_UPSTREAM: control
    volumes:
      - type: bind
        source: ${CLUBELO_CANARY_CONTROL_OBSERVER_DIR:?Required fresh control run observer dir}
        target: /var/lib/clubelo-canary-run
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:rw,exec,nosuid,nodev,size=2g,uid=1000,gid=1000,mode=1770
      - /config:rw,noexec,nosuid,nodev,size=16m,uid=1000,gid=1000,mode=0700
      - /app/.config:rw,noexec,nosuid,nodev,size=64m,uid=1000,gid=1000,mode=0700
      - /app/.local:rw,noexec,nosuid,nodev,size=64m,uid=1000,gid=1000,mode=0700
      - /home/seluser:rw,nosuid,nodev,size=128m
    shm_size: 512m
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 512

  solver-candidate:
    <<: *hardened
    profiles: [candidate]
    image: "${CLUBELO_CANARY_CANDIDATE_REPOSITORY:?Required instrumented candidate repository}@sha256:${CLUBELO_CANARY_CANDIDATE_DIGEST:?Required immutable candidate digest}"
    pull_policy: never
    networks: [internal]
    user: "${CLUBELO_CANARY_SOLVER_UID:-1000}:${CLUBELO_CANARY_SOLVER_GID:-1000}"
    environment:
      <<: *solver-environment
      CLUBELO_CANARY_UPSTREAM: candidate
    volumes:
      - type: bind
        source: ${CLUBELO_CANARY_CANDIDATE_OBSERVER_DIR:?Required fresh candidate run observer dir}
        target: /var/lib/clubelo-canary-run
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:rw,exec,nosuid,nodev,size=2g,uid=1000,gid=1000,mode=1770
      - /config:rw,noexec,nosuid,nodev,size=16m,uid=1000,gid=1000,mode=0700
      - /app/.config:rw,noexec,nosuid,nodev,size=64m,uid=1000,gid=1000,mode=0700
      - /app/.local:rw,noexec,nosuid,nodev,size=64m,uid=1000,gid=1000,mode=0700
      - /home/seluser:rw,nosuid,nodev,size=128m
    shm_size: 512m
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 512

  runner:
    <<: *hardened
    image: apache/airflow:2.11.2-python3.11@sha256:aac8468234dfa802c5ac4d6318bbf3b620793b55569ac230f584dc3c1f0ca49d
    pull_policy: never
    networks: [internal, egress]
    user: "${CLUBELO_CANARY_RUNNER_UID:-50000}:${CLUBELO_CANARY_RUNNER_GID:-0}"
    entrypoint: ["python", "-m", "scripts.research.clubelo_solver_canary", "airflow-task"]
    working_dir: /canary/code
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: /canary/code
      AIRFLOW_HOME: /canary/airflow
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /canary/dags
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////canary/airflow/airflow.db
      AIRFLOW__LOGGING__BASE_LOG_FOLDER: /canary/airflow/logs
      AIRFLOW__LOGGING__REMOTE_LOGGING: "false"
      AIRFLOW__CORE__ENABLE_XCOM_PICKLING: "false"
      CLUBELO_CANARY_ARM: ${CLUBELO_CANARY_ARM:?Required selected arm}
      CLUBELO_CANARY_RUN_ID: ${CLUBELO_CANARY_RUN_ID:?Required unique real DagRun id}
      CLUBELO_PROXY_CONTROL_URL: http://clubelo-canary-gateway:8899
      CLUBELO_PROXY_CONTROL_TOKEN_FILE: /canary/secrets/control_token
      CLUBELO_PROXY_MAX_BYTES: "33554432"
      CLUBELO_PROXY_TTL_SECONDS: "3600"
    volumes:
      - type: bind
        source: ${CLUBELO_CANARY_CODE_DIR:?Required sanitized frozen code directory}
        target: /canary/code
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./solver_canary_dag.py
        target: /canary/dags/solver_canary_dag.py
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${CLUBELO_CANARY_CONTROL_TOKEN_FILE:?Required existing control token file}
        target: /canary/secrets/control_token
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${CLUBELO_CANARY_SELECTED_OBSERVER_DIR:?Required selected arm fresh run observer dir}
        target: /var/lib/clubelo-canary-run
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${CLUBELO_CANARY_OUTPUT_DIR:?Required fresh run output directory}
        target: /canary/output
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=128m
      - /canary/airflow:rw,nosuid,nodev,size=256m,mode=1777
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 128

networks:
  internal:
    internal: true
    driver: bridge
  egress:
    driver: bridge
