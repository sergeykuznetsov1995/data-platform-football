# Isolated ESPN Native v2 scheduler. Every bind source must come from one
# immutable release; the generated DagBag projection contains exactly seven
# ESPN root DAGs and never the shared dag_master_pipeline owner.
name: espn-airflow

x-espn-airflow-common: &espn-airflow-common
  image: ${ESPN_AIRFLOW_IMAGE:?set an immutable ESPN Airflow image reference}
  user: ${AIRFLOW_UID:-50000}:0
  shm_size: 512m
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  cap_add:
    - CHOWN
    - SETGID
    - SETUID
  environment: &espn-airflow-environment
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY:?set the Airflow fernet key}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: utc
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__WEBSERVER__DEFAULT_UI_TIMEZONE: UTC
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY:?set the Airflow webserver secret}
    # Supply a complete DSN so reserved password characters must be URL-encoded
    # explicitly instead of being interpolated into a URI by Compose.
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${ESPN_AIRFLOW_DATABASE_URL:?set the dedicated URL-encoded ESPN Airflow metadata DSN}
    CONNECTION_CHECK_MAX_COUNT: "0"
    PYTHONPATH: /opt/airflow
    PYTHONPYCACHEPREFIX: /tmp/pycache
    TRINO_HOST: trino
    TRINO_PORT: ${TRINO_PORT:-8443}
    TRINO_USER: ${TRINO_USER:-airflow}
    TRINO_PASSWORD: ${TRINO_PASSWORD:?set Trino password}
    ICEBERG_WAREHOUSE: ${ICEBERG_WAREHOUSE:?set warehouse bucket}
    S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3 access key}
    S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3 secret key}
    ESPN_REGISTRY_PATH: /opt/airflow/configs/espn/registry.yaml
    ESPN_RAW_STORE_URI: s3://${ICEBERG_WAREHOUSE}/raw/espn
    ESPN_ARTIFACT_ROOT_URI: s3://${ICEBERG_WAREHOUSE}/artifacts/espn
    ESPN_RELEASE_COMMIT: ${ESPN_RELEASE_COMMIT:?set exact ESPN release commit}
    ESPN_RELEASE_TREE_SHA256: ${ESPN_RELEASE_TREE_SHA256:?set exact ESPN release tree SHA-256}
    # Set this complete claim only for the guarded all-181 backfill canary.
    ESPN_CANARY_CLAIM_URI:
    ESPN_CANARY_CLAIM_SHA256:
    # Metadata is dedicated, but leases/request gates stay shared with every
    # compatible ESPN writer through this separately supplied control plane.
    ESPN_CONTROL_DATABASE_URL: ${ESPN_CONTROL_DATABASE_URL:?set shared ESPN control database URL}
    ESPN_ISOLATED_STACK: "1"
    ESPN_RAW_S3_ENDPOINT: seaweedfs:8333
    ESPN_RAW_S3_SCHEME: http
    ESPN_ARTIFACT_S3_ENDPOINT: seaweedfs:8333
    ESPN_ARTIFACT_S3_SCHEME: http
    ESPN_DISCOVERY_CATALOG_URL: https://sports.core.api.espn.com/v2/sports/soccer/leagues?limit=500&lang=en&region=us
    # Null values mean host inheritance when set and omission when absent.
    # Empty strings and incomplete pairs are rejected by admission.
    ESPN_DISCOVERY_STATE_REF_URI:
    ESPN_DISCOVERY_STATE_REF_SHA256:
    TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    ALERT_ENV: espn-isolated
    JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
  volumes:
    - espn_airflow_logs:/opt/airflow/logs
    - type: bind
      source: ${ESPN_DAGBAG_ROOT:?set a fresh exact ESPN DagBag projection}
      target: /opt/airflow/dags
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ${ESPN_RELEASE_ROOT:?set an immutable ESPN release root}/dags
      target: /opt/espn-source/dags
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ${ESPN_RELEASE_ROOT}/scrapers
      target: /opt/airflow/scrapers
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ${ESPN_RELEASE_ROOT}/scripts
      target: /opt/airflow/scripts
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ${ESPN_RELEASE_ROOT}/configs/espn
      target: /opt/airflow/configs/espn
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ${ESPN_RELEASE_ROOT}/configs/medallion
      target: /opt/airflow/configs/medallion
      read_only: true
      bind:
        create_host_path: false
  networks:
    - default
    - storage
    - backend

services:
  airflow-metadb:
    image: ${ESPN_POSTGRES_IMAGE:?set a PostgreSQL image pinned by digest}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - FOWNER
      - DAC_READ_SEARCH
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${ESPN_AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: airflow
    volumes:
      - espn_airflow_metadata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 12

  airflow-init:
    <<: *espn-airflow-common
    restart: "no"
    entrypoint: /bin/bash
    command:
      - -euc
      - |
        python /opt/airflow/scripts/verify_espn_database_topology.py
        airflow db migrate
        airflow pools set espn_http_pool 1 'ESPN direct-only HTTP work'
        airflow pools set espn_repository_pool 16 'ESPN repository DDL/write coordination'
        for dag_id in \
          dag_ingest_espn \
          dag_repair_espn \
          dag_backfill_espn \
          dag_replay_espn \
          dag_discover_espn_registry \
          dag_monitor_espn \
          dag_trigger_espn_daily; do
          airflow dags pause "$${dag_id}" >/dev/null 2>&1 || true
        done
    depends_on:
      airflow-metadb:
        condition: service_healthy

  airflow-scheduler:
    <<: *espn-airflow-common
    command: scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 1G

  airflow-webserver:
    <<: *espn-airflow-common
    profiles: ["ui"]
    command: webserver
    restart: unless-stopped
    ports:
      - "${ESPN_AIRFLOW_UI_BIND:-127.0.0.1:8086}:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  espn_airflow_metadata: {}
  espn_airflow_logs: {}

networks:
  default: {}
  storage:
    external: true
    name: dp-storage
  backend:
    external: true
    name: dp-backend
