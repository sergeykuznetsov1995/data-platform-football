name: Unit suite

# The existing selector chooses affected tests; FULL escalates to the whole suite.
# A master push checks the exact delivered revision. Nightly remains a separate signal.

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: unit-suite-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    name: unit-suite
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install test runtime
        shell: bash
        run: |
          # FULL may select any unit test, so the frozen complete runtime stays required.
          python -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: Preflight pinned TLS library
        shell: bash
        run: |
          set -euo pipefail
          tls_dir="$RUNNER_TEMP/tls-client"
          tls_lib="$tls_dir/tls-client.so"
          install -d -m 0755 "$tls_dir"
          curl --proto '=https' --tlsv1.2 --proto-redir '=https' \
            --connect-timeout 20 --max-time 300 -fsSL \
            https://github.com/bogdanfinn/tls-client/releases/download/v1.13.1/tls-client-linux-ubuntu-amd64-1.13.1.so \
            -o "$tls_lib"
          echo "e4a4a5d771d1bd1558186a5ee46af1dfa1318bd31950d68ccd81ed30bad078fc  $tls_lib" \
            | sha256sum -c -
          test "$(stat -c %s "$tls_lib")" -eq 15236872
          chmod 0444 "$tls_lib"
          export TLS_LIBRARY_PATH="$tls_lib"
          echo "TLS_LIBRARY_PATH=$tls_lib" >> "$GITHUB_ENV"
          python -c "import tls_requests; client = tls_requests.Client(); client.close()"

      - name: Diff check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: git diff --check "$BASE_SHA...$HEAD_SHA"

      - name: Affected unit tests
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        shell: bash
        run: |
          set -euo pipefail
          python scripts/select_tests_by_diff.py \
            --base "$BASE_SHA" --head "$HEAD_SHA" --json | tee selected-tests.json
          python scripts/select_tests_by_diff.py \
            --base "$BASE_SHA" --head "$HEAD_SHA" --pytest-args > selected-targets.txt
          mapfile -t targets < selected-targets.txt
          if ((${#targets[@]} == 0)); then
            echo "No affected unit tests"
            exit 0
          fi
          printf 'Selected: %s\n' "${targets[@]}"
          # Host-only WhoScored seals stay in local/nightly profiles, not hosted CI.
          pytest -q "${targets[@]}" \
            --ignore=tests/unit/scripts/test_bench_whoscored_capacity.py \
            --ignore=tests/unit/scripts/test_whoscored_production_admission.py \
            --ignore=tests/unit/scripts/test_whoscored_go_decision.py \
            --ignore=tests/unit/scripts/test_whoscored_capacity_container_runtime.py \
            --ignore=tests/unit/scripts/test_generate_whoscored_deployment_attestation.py \
            --ignore=tests/unit/scripts/test_validate_whoscored_build_provenance.py

      - name: Offline BI and catalog scripts
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: pytest -q tests/integration/test_bi_catalog_scripts.py -m unit
