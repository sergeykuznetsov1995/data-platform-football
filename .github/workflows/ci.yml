name: Unit suite

# Repo-wide gate: the full unit suite on every PR (and on master pushes as a
# baseline signal). Source-specific deep gates (e.g. sofascore-ci.yml) stay
# separate — this workflow is the floor every change must clear.

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: unit-suite-${{ github.event.pull_request.number || github.ref }}
  # PRs: newer push supersedes the running check. master: never cancel —
  # every merge keeps its own baseline run so a red master stays bisectable.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches the proven-green local venv (/root/.venvs/dpf-test) the
          # pins in requirements-ci.txt were frozen from.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install test runtime
        shell: bash
        run: |
          # requirements-ci.txt is a pip freeze of the local proven-green test
          # venv. Airflow is deliberately absent from it: tests/unit/dags/
          # conftest.py installs its operator stubs only when the real package
          # is missing, and the DAG topology tests assert against those stubs.
          # A hand-curated short list (sofascore-ci.yml style) is NOT enough
          # for the full suite — it left 36 collection errors and ~53 missing-
          # module failures (bs4/duckdb/sqlglot/pyiceberg/curl_cffi/soccerdata/
          # selenium/...), so the full frozen set is the contract.
          python -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: Full unit suite
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        # The one deselect below seals the REAL interpreter's site-packages
        # path (every component must be root-owned and non-group-writable —
        # scripts/research/bench_whoscored_capacity.py:_trusted_worker_site_packages).
        # That holds on the production host (/root/.venvs) and can never hold
        # on a hosted runner (toolcache is runner-owned), so it stays a
        # local-suite-only check.
        run: |
          pytest -q tests/unit \
            --deselect tests/unit/scripts/test_bench_whoscored_capacity.py::test_worker_runtime_bundle_is_deterministic_sealed_and_checkout_free
