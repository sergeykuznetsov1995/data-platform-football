name: FotMob contour recipe

# Рецепт изолированного контура FotMob (#1155, этап 3). Статические тесты и прогон
# скриптов автомата против заглушек входят в общий сьют (ci.yml); здесь — они же
# плюс рендер compose через `docker compose config`, которого в общем сьюте нет.

on:
  pull_request:
    paths:
      - "deploy/fotmob/**"
      - "tests/unit/deploy/test_fotmob_*.py"
      - "tests/integration/test_compose_validity.py"
      - ".env.example"
      - ".github/workflows/fotmob-ci.yml"
  push:
    branches: [master]
    paths:
      - "deploy/fotmob/**"
      - "tests/unit/deploy/test_fotmob_*.py"
      - "tests/integration/test_compose_validity.py"
      - ".env.example"
      - ".github/workflows/fotmob-ci.yml"

permissions:
  contents: read

concurrency:
  group: fotmob-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  recipe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test runtime
        run: python -m pip install --disable-pip-version-check pytest PyYAML

      - name: Recipe statics and delivery scripts against stubs
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          pytest -q \
            tests/unit/deploy/test_fotmob_contour_recipe.py \
            tests/unit/deploy/test_fotmob_delivery_scripts.py

      - name: Render the contour with docker compose config
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: pytest -q tests/integration/test_compose_validity.py -k fotmob
