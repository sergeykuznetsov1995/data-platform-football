name: SofaScore production CI

on:
  pull_request:
    paths:
      - ".env.example"
      - ".github/workflows/sofascore-*.yml"
      - "compose.yaml"
      - "configs/sofascore/**"
      - "dags/dag_ingest_sofascore.py"
      - "dags/dag_backfill_sofascore_all_mens.py"
      - "dags/dag_refresh_sofascore_all_mens.py"
      - "dags/dag_players_sofascore_all_mens.py"
      - "dags/dag_sofascore_manifest_maintenance.py"
      - "dags/dag_sofascore_schedule_maintenance.py"
      - "dags/dag_replay_sofascore_raw.py"
      - "dags/.airflowignore"
      - "dags/utils/sofascore_all_mens_state.py"
      - "dags/dag_iceberg_maintenance.py"
      - "dags/dag_sofascore_pipeline.py"
      - "dags/dag_transform_e3.py"
      - "dags/scripts/*sofascore*"
      - "dags/sql/**/*sofascore*"
      - "dags/utils/maintenance_tasks.py"
      - "dags/utils/sofascore_dq.py"
      - "dags/utils/sofascore_pool_wait.py"
      - "dags/utils/sofascore_red_share.py"
      - "deploy/sofascore/**"
      - "scrapers/base/**"
      - "scrapers/sofascore/**"
      - "scripts/**/*sofascore*"
      - "scripts/ci/check_sofascore_dag_imports.py"
      - "scripts/proxy_filter/**"
      - "tests/fixtures/sofascore*"
      - "tests/airflow_real/test_sofascore_players_lane.py"
      - "docker/images/airflow/requirements-ci-dag-import-*.lock"
      - "tests/integration/test_compose_validity.py"
      - "tests/unit/dags/test_dag_iceberg_maintenance.py"
      - "tests/unit/dags/test_maintenance_tasks.py"
      - "tests/unit/**/*sofascore*"
      - "tests/unit/scripts/test_filter_proxy.py"
      - "requirements/test/sofascore-unit-py311.lock"
      - "requirements/test/sofascore-unit-py311.in"
      - "tests/unit/scripts/test_source_test_profiles.py"

permissions:
  contents: read

concurrency:
  group: sofascore-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/test/sofascore-unit-py311.lock

      - name: Install test runtime
        shell: bash
        run: |
          # Airflow is absent so the existing DAG topology stubs stay active.
          python -m pip install --disable-pip-version-check --require-hashes \
            -r requirements/test/sofascore-unit-py311.lock
          python -m pip check

      - name: Static checks
        run: |
          ruff check \
            scrapers/sofascore \
            dags/dag_ingest_sofascore.py \
            dags/dag_backfill_sofascore_all_mens.py \
            dags/dag_refresh_sofascore_all_mens.py \
            dags/dag_players_sofascore_all_mens.py \
            dags/dag_sofascore_manifest_maintenance.py \
            dags/dag_sofascore_schedule_maintenance.py \
            dags/dag_replay_sofascore_raw.py \
            dags/dag_iceberg_maintenance.py \
            dags/dag_sofascore_pipeline.py \
            dags/scripts/run_sofascore_scraper.py \
            dags/scripts/replay_sofascore_raw.py \
            dags/scripts/prepare_sofascore_workload.py \
            dags/scripts/run_sofascore_discovery.py \
            dags/scripts/run_sofascore_scope_cycle.py \
            dags/scripts/run_sofascore_schedule_refresh.py \
            dags/utils/sofascore_all_mens_state.py \
            dags/utils/maintenance_tasks.py \
            dags/utils/sofascore_dq.py \
            scripts/migrate_sofascore_production.py \
            scripts/migrate_sofascore_partition_keys.py \
            scripts/migrate_sofascore_partition_keys_batched.py \
            scripts/backfill_sofascore.py \
            scripts/purge_sofascore_manifest_observations.py \
            scripts/sofascore_capture_manifest_guard_v1.py \
            scripts/sofascore_runtime_preflight.py \
            scripts/ci/check_sofascore_dag_imports.py \
            tests/airflow_real/test_sofascore_players_lane.py \
            deploy/sofascore/campaign_day.py \
            deploy/sofascore/pipeline_watchdog.py \
            deploy/sofascore/pipeline_metrics.py \
            deploy/sofascore/pipeline_issues.py \
            deploy/sofascore/endpoint_journal.py \
            deploy/sofascore/veha1_measure.py \
            scripts/research/replay_sofascore_watchdog.py \
            scripts/proxy_filter
          python -m compileall -q \
            scrapers/sofascore dags/scripts dags/utils scripts/proxy_filter \
            dags/dag_ingest_sofascore.py \
            dags/dag_sofascore_pipeline.py \
            dags/dag_sofascore_manifest_maintenance.py \
            dags/dag_sofascore_schedule_maintenance.py \
            dags/dag_players_sofascore_all_mens.py \
            dags/dag_replay_sofascore_raw.py \
            scripts/migrate_sofascore_production.py \
            scripts/migrate_sofascore_partition_keys.py \
            scripts/migrate_sofascore_partition_keys_batched.py
          python -m py_compile \
            dags/dag_iceberg_maintenance.py \
            dags/utils/maintenance_tasks.py \
            scripts/purge_sofascore_manifest_observations.py \
            scripts/sofascore_capture_manifest_guard_v1.py \
            scripts/sofascore_runtime_preflight.py \
            deploy/sofascore/endpoint_journal.py

      - name: SofaScore unit and topology tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          pytest -q \
            tests/unit/configs/test_sofascore_endpoint_coverage.py \
            tests/unit/configs/test_sofascore_denominator_file.py \
            tests/unit/dags/test_dag_backfill_sofascore_all_mens.py \
            tests/unit/dags/test_dag_ingest_sofascore.py \
            tests/unit/dags/test_dag_refresh_sofascore_all_mens.py \
            tests/unit/dags/test_dag_players_sofascore_all_mens.py \
            tests/unit/dags/test_dag_replay_sofascore_raw.py \
            tests/unit/dags/test_dag_iceberg_maintenance.py \
            tests/unit/dags/test_dag_sofascore_pipeline.py \
            tests/unit/dags/test_dag_transform_e3_sofascore_dq.py \
            tests/unit/dags/test_maintenance_tasks.py \
            tests/unit/deploy/test_sofascore_campaign_day.py \
            tests/unit/deploy/test_sofascore_contour_recipe.py \
            tests/unit/deploy/test_sofascore_delivery_scripts.py \
            tests/unit/deploy/test_sofascore_deploy_script.py \
            tests/unit/deploy/test_sofascore_gateway_lease_watchdog.py \
            tests/unit/deploy/test_sofascore_gateway_probe_load.py \
            tests/unit/deploy/test_sofascore_pipeline_watchdog.py \
            tests/unit/deploy/test_sofascore_run_from_release.py \
            tests/unit/deploy/test_sofascore_endpoint_journal.py \
            tests/unit/deploy/test_sofascore_veha1_measure.py \
            tests/unit/deploy/test_sofascore_daily_parity.py \
            tests/unit/dq/test_sofascore_dq.py \
            tests/unit/scrapers/test_run_sofascore_discovery.py \
            tests/unit/scrapers/test_run_sofascore_scraper.py \
            tests/unit/scrapers/test_sofascore_all_mens_campaign.py \
            tests/unit/scrapers/test_sofascore_history_controller.py \
            tests/unit/scrapers/test_sofascore_schedule_refresh.py \
            tests/unit/scrapers/test_sofascore_rate_control.py \
            tests/unit/scrapers/test_sofascore_writer_lock.py \
            tests/unit/scrapers/test_sofascore_maintenance.py \
            tests/unit/scrapers/test_sofascore_camoufox_capture.py \
            tests/unit/scrapers/test_sofascore_catalog.py \
            tests/unit/scrapers/test_sofascore_capture_adapters.py \
            tests/unit/scrapers/test_sofascore_capture_engine.py \
            tests/unit/scrapers/test_sofascore_discovery.py \
            tests/unit/scrapers/test_sofascore_endpoint_manifest.py \
            tests/unit/scrapers/test_sofascore_iceberg_writer.py \
            tests/unit/scrapers/test_sofascore_lease_client.py \
            tests/unit/scrapers/test_sofascore_live_capture.py \
            tests/unit/scrapers/test_sofascore_manifest_batching.py \
            tests/unit/scrapers/test_sofascore_manifest_scope_index.py \
            tests/unit/scrapers/test_sofascore_partition_keys.py \
            tests/unit/scrapers/test_sofascore_pipeline.py \
            tests/unit/scrapers/test_sofascore_workload_plan.py \
            tests/unit/scrapers/test_sofascore_workload_runtime.py \
            tests/unit/scrapers/test_sofascore_raw_fields.py \
            tests/unit/scrapers/test_sofascore_raw_replay.py \
            tests/unit/scrapers/test_sofascore_raw_store.py \
            tests/unit/scrapers/test_sofascore_registry_v2.py \
            tests/unit/scrapers/test_scrapers_lazy_import.py \
            tests/unit/scrapers/test_sofascore_scraper.py \
            tests/unit/scrapers/test_sofascore_season_pipeline.py \
            tests/unit/scrapers/test_sofascore_season_chunks.py \
            tests/unit/scrapers/test_sofascore_season_chunk_capture.py \
            tests/unit/scrapers/test_sofascore_runtime_fingerprint.py \
            tests/unit/scrapers/test_sofascore_season_accounting.py \
            tests/unit/scrapers/test_sofascore_static_workload_policy.py \
            tests/unit/scripts/test_backfill_sofascore.py \
            tests/unit/scripts/test_bench_sofascore_offline_replay.py \
            tests/unit/scripts/test_build_sofascore_all_mens_snapshot.py \
            tests/unit/scripts/test_enrich_sofascore_all_mens_snapshot.py \
            tests/unit/scripts/test_fbref_proxy_filter_isolation.py \
            tests/unit/scripts/test_filter_proxy.py \
            tests/unit/scripts/test_migrate_sofascore_production.py \
            tests/unit/scripts/test_migrate_sofascore_partition_keys.py \
            tests/unit/scripts/test_migrate_sofascore_partition_keys_batched.py \
            tests/unit/scripts/test_prepare_sofascore_workload.py \
            tests/unit/scripts/test_purge_sofascore_manifest_observations.py \
            tests/unit/scripts/test_replay_sofascore_raw.py \
            tests/unit/scripts/test_run_sofascore_schedule_refresh.py \
            tests/unit/scripts/test_run_sofascore_scope_cycle.py \
            tests/unit/scripts/test_run_sofascore_workload.py \
            tests/unit/scripts/test_sofascore_capture_manifest_guard_v1.py \
            tests/unit/scripts/test_sofascore_runtime_preflight.py \
            tests/unit/sql/test_sofascore_league_table_silver.py \
            tests/unit/sql/test_sofascore_post_shot_xg.py \
            tests/unit/utils/test_sofascore_all_mens_state.py \
            tests/unit/utils/test_sofascore_pool_wait.py \
            tests/unit/utils/test_sofascore_red_share.py \
            tests/integration/test_compose_validity.py

  real-airflow-dag-import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        airflow-version: ["2.7.3", "2.11.2"]
        include:
          - airflow-version: "2.7.3"
            image: apache/airflow:2.7.3-python3.11@sha256:a8c67ae095c03868e56c2d95c9a57a1b9a47e87247d923e329cb7c15e6d47ee5
          - airflow-version: "2.11.2"
            image: apache/airflow:2.11.2-python3.11@sha256:aac8468234dfa802c5ac4d6318bbf3b620793b55569ac230f584dc3c1f0ca49d
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: docker/images/airflow/requirements-ci-dag-import-${{ matrix.airflow-version }}.lock

      - name: Download the locked Airflow parser wheel delta
        env:
          AIRFLOW_VERSION: ${{ matrix.airflow-version }}
        run: |
          python -m pip download \
            --no-deps --require-hashes --only-binary=:all: \
            --dest "${RUNNER_TEMP}/airflow-wheels" \
            -r "docker/images/airflow/requirements-ci-dag-import-${AIRFLOW_VERSION}.lock"

      - name: Stage production SofaScore DAGs outside repository ignore rules
        run: |
          dag_dir="${RUNNER_TEMP}/sofascore-ci-dags"
          test ! -e "${dag_dir}"
          mkdir -p "${dag_dir}"
          for dag in \
            dag_ingest_sofascore.py \
            dag_backfill_sofascore_all_mens.py \
            dag_refresh_sofascore_all_mens.py \
            dag_players_sofascore_all_mens.py \
            dag_sofascore_manifest_maintenance.py \
            dag_sofascore_schedule_maintenance.py \
            dag_replay_sofascore_raw.py
          do
            cp "${GITHUB_WORKSPACE}/dags/${dag}" "${dag_dir}/${dag}"
          done

      - name: Check real Airflow imports and mapped players accounting
        env:
          AIRFLOW_IMAGE: ${{ matrix.image }}
          AIRFLOW_VERSION: ${{ matrix.airflow-version }}
        run: |
          docker run --rm \
            --read-only \
            --network none \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,mode=1777 \
            --tmpfs /home/airflow/.local/lib/python3.11/site-packages/ci-delta:rw,nosuid,nodev,uid=50000,gid=0,mode=0700 \
            -e AIRFLOW_VERSION \
            -e PYTHONUSERBASE=/home/airflow/.local \
            -e PIP_USER=false \
            -e PIP_TARGET=/home/airflow/.local/lib/python3.11/site-packages/ci-delta \
            -e PIP_NO_INDEX=1 \
            -e PIP_FIND_LINKS=/ci-wheels \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e HOME=/tmp/home \
            -e AIRFLOW_HOME=/tmp/airflow \
            -e AIRFLOW__CORE__LOAD_EXAMPLES=False \
            -e AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////tmp/airflow/airflow.db \
            -e AIRFLOW__CORE__DAGS_FOLDER=/ci-dags \
            -e AIRFLOW__CORE__PLUGINS_FOLDER=/tmp/empty-plugins \
            -e PYTHONPATH=/workspace:/workspace/dags \
            -v "${GITHUB_WORKSPACE}:/workspace:ro" \
            -v "${RUNNER_TEMP}/sofascore-ci-dags:/ci-dags:ro" \
            -v "${RUNNER_TEMP}/airflow-wheels:/ci-wheels:ro" \
            --workdir /workspace \
            --entrypoint /bin/bash \
            "$AIRFLOW_IMAGE" \
            -euc '
              mkdir -p "$HOME" "$AIRFLOW_HOME" /tmp/empty-plugins
              case "$AIRFLOW_VERSION" in
                2.7.3|2.11.2)
                  python -m pip install \
                    --no-deps --require-hashes --only-binary=:all: \
                    -r "docker/images/airflow/requirements-ci-dag-import-${AIRFLOW_VERSION}.lock"
                  ;;
                *) exit 1 ;;
              esac
              export PYTHONPATH="/home/airflow/.local/lib/python3.11/site-packages/ci-delta:$PYTHONPATH"
              python -m pip check
              test "$(airflow version)" = "$AIRFLOW_VERSION"
              airflow db migrate
              airflow dags list-import-errors
              python /workspace/scripts/ci/check_sofascore_dag_imports.py
              python -m unittest tests.airflow_real.test_sofascore_players_lane -v
            '
